services:
  fintech-db:
    image: postgres:latest
    container_name: fintech-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - fintech-net
    restart: unless-stopped
  fintech-backend:
    build: .
    container_name: fintech-backend
    depends_on:
      - fintech-db
    environment:
      DATABASE_URL: postgresql://fintech:fintech@fintech-db:5432/fintech
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    networks:
      - fintech-net
    restart: unless-stopped
volumes:
  pgdata:
networks:
  fintech-net:
    name: fintech-net