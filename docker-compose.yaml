services:
  fintech-db:
    image: postgres:16-alpine
    container_name: fintech-db
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  fintech-backend:
    build: .
    container_name: fintech-backend
    depends_on:
      - fintech-db
    environment:
      DATABASE_URL: postgresql://fintech:fintech@fintech-db:5432/fintech
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"